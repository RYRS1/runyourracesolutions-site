backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "index.html"
        fields:
          - { label: "Hero Headline", name: "hero_headline", widget: "string" }
          - { label: "Hero Subheadline", name: "hero_subheadline", widget: "string" }
          - { label: "CTA Button 1", name: "cta1", widget: "string" }
          - { label: "CTA Button 2", name: "cta2", widget: "string" }

      - name: "services"
        label: "Services Page"
        file: "services.html"
        fields:
          - { label: "Intro Text", name: "intro", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "about.html"
        fields:
          - { label: "About Text", name: "about_text", widget: "text" }

      - name: "contact"
        label: "Contact Page"
        file: "contact.html"
        fields:
          - { label: "Contact Instructions", name: "contact_text", widget: "text" }
