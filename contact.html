<form action="https://formspree.io/f/mdendgpz" method="POST" id="quoteForm">

  <!-- 01 / contact -->
  <h3>01 / contact</h3>
  <label>
    Name *
    <input type="text" name="name" required>
  </label>

  <label>
    Email *
    <input type="email" name="email" required>
  </label>

  <label>
    Phone *
    <input type="tel" name="phone" required>
  </label>

  <!-- 02 / site -->
  <h3>02 / site</h3>
  <label>
    Property Address *
    <input type="text" name="address" required>
  </label>

  <label>
    City *
    <input type="text" name="city" required>
  </label>

  <label>
    State *
    <input type="text" name="state" value="TX" required>
  </label>

  <!-- 03 / security requirement -->
  <h3>03 / security requirement</h3>
  <label>
    Service of Interest *
    <select name="service" required>
      <option value="Mobile Surveillance Trailers">Mobile Surveillance Trailers</option>
      <option value="Armed Security Guards">Armed Security Guards</option>
      <option value="Unarmed Security Guards">Unarmed Security Guards</option>
      <option value="Remote Monitoring & Video Verification">Remote Monitoring & Video Verification</option>
      <option value="Security & Privacy Fencing">Security & Privacy Fencing</option>
      <option value="Security Consulting & Assessment">Security Consulting & Assessment</option>
      <option value="Multiple Services / Unsure">Multiple Services / Unsure</option>
    </select>
  </label>

  <label>
    Desired Start *
    <select name="start" required>
      <option value="Immediately">Immediately</option>
      <option value="Within 7 days">Within 7 days</option>
      <option value="Within 30 days">Within 30 days</option>
      <option value="1–3 months">1–3 months</option>
      <option value="Planning / Future">Planning / Future</option>
    </select>
  </label>

  <!-- 04 / project details -->
  <h3>04 / project details</h3>
  <label>
    Project Details *
    <textarea name="details" required></textarea>
  </label>

  <button type="submit">submit request →</button>
</form>

<!-- Success Panel -->
<div id="successPanel" style="display:none;">
  <h2>We're on it.</h2>
  <p>Your security request has been received. A Run Your Race Solutions representative will review the information and contact you shortly.</p>
  <a href="index.html">return home →</a>
</div>

<script>
  const form = document.getElementById('quoteForm');
  const successPanel = document.getElementById('successPanel');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = new FormData(form);
    const response = await fetch(form.action, {
      method: 'POST',
      body: data
    });

    if (response.ok) {
      form.style.display = 'none';
      successPanel.style.display = 'block';
      form.reset();
    } else {
      alert('There was a problem submitting your request.');
    }
  });
</script>
